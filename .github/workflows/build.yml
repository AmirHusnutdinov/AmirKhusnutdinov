on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install
        working-directory: demo  # Указываем, что Maven должен работать в каталоге demo

      - name: Run tests
        run: mvn test
        working-directory: demo  # Указываем, что Maven должен работать в каталоге demo

      - name: Package application
        run: mvn package
        working-directory: demo  # Указываем, что Maven должен работать в каталоге demo
