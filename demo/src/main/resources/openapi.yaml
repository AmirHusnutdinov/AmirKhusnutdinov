openapi: 3.0.0
info:
  title: HW1 API
  description: API for HW1 project
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/articles:
    get:
      summary: Get all articles
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
    post:
      summary: Create a new article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article'
      responses:
        '201':
          description: Article created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
  /api/articles/{id}:
    get:
      summary: Get article by ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the article to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
    put:
      summary: Update an article
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the article to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article'
      responses:
        '200':
          description: Article updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
    delete:
      summary: Delete an article
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the article to delete
          schema:
            type: integer
      responses:
        '204':
          description: Article deleted
        '404':
          description: Article not found
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Sample Article"
        content:
          type: string
          example: "This is a sample article content."
